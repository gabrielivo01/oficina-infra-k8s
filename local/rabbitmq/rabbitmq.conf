# Configuracao do broker de desenvolvimento (Docker Compose e kind).
# A topologia (exchanges, filas, DLQs, bindings) e o usuario de dev vem de
# definitions.json, importado a cada boot (idempotente).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# Limite de memoria baixo para o ambiente de dev (WSL2/kind com pouca RAM).
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 256MiB

management.tcp.port = 15672
prometheus.tcp.port = 15692
