name: Deploy Infra (Terraform + observability stack)

on:
  workflow_dispatch:
    inputs:
      terraform_env_dir:
        description: "Terraform environment directory"
        required: true
        default: "infra/terraform/environments/dev"
      terraform_auto_apply:
        description: "Apply terraform changes automatically"
        required: true
        type: boolean
        default: false
      install_observability_stack:
        description: "Also run scripts/install_observability_stack.sh (requires helm/kubectl access to the cluster)"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Set up Helm
        if: ${{ github.event.inputs.install_observability_stack == 'true' }}
        uses: azure/setup-helm@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Terraform init
        run: terraform -chdir=${{ github.event.inputs.terraform_env_dir }} init -input=false

      - name: Terraform plan
        env:
          TF_VAR_lambda_function_name: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME }}
          TF_VAR_lambda_invoke_arn: ${{ secrets.AUTH_LAMBDA_INVOKE_ARN }}
          TF_VAR_app_public_url: ${{ secrets.APP_PUBLIC_URL }}
        run: terraform -chdir=${{ github.event.inputs.terraform_env_dir }} plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.terraform_auto_apply == 'true' }}
        run: terraform -chdir=${{ github.event.inputs.terraform_env_dir }} apply -input=false -auto-approve tfplan

      - name: Configure kubeconfig
        if: ${{ github.event.inputs.install_observability_stack == 'true' }}
        run: |
          aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Install/upgrade observability stack
        if: ${{ github.event.inputs.install_observability_stack == 'true' }}
        run: |
          chmod +x scripts/install_observability_stack.sh
          scripts/install_observability_stack.sh

      - name: Apply ClusterSecretStore (external-secrets)
        if: ${{ github.event.inputs.install_observability_stack == 'true' }}
        run: kubectl apply -f k8s/external-secrets/clustersecretstore-aws.yaml
