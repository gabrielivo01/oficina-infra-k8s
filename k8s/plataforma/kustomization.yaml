# Plataforma compartilhada no kind: RabbitMQ, Jaeger e OTel Collector no
# namespace "plataforma", com Ingress para as UIs.
#
# As configuracoes vem de local/ (mesmos arquivos do Docker Compose, fonte unica).
# Como ficam fora desta pasta, o build exige:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s/plataforma
# (scripts/plataforma_up.sh ja faz isso). O sufixo de hash dos ConfigMaps faz o
# rollout automatico quando um desses arquivos muda.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plataforma

resources:
  - namespace.yaml
  - rabbitmq.yaml
  - jaeger.yaml
  - otel-collector.yaml
  - ingress.yaml

configMapGenerator:
  - name: rabbitmq-config
    files:
      - 90-oficina.conf=../../local/rabbitmq/rabbitmq.conf
      - definitions.json=../../local/rabbitmq/definitions.json
  - name: jaeger-config
    files:
      - config.yaml=../../local/jaeger-config.yaml
  - name: otel-collector-config
    files:
      - config.yaml=../../local/otel-collector-config.yaml
