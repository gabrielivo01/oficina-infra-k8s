# RabbitMQ (1 no) com a mesma configuracao e topologia do Docker Compose
# (local/rabbitmq/). Servicos usam rabbitmq.plataforma.svc:5672, usuario
# "oficina" (senha de dev "oficina").
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: prometheus
      port: 15692
      targetPort: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      terminationGracePeriodSeconds: 30
      # Usuario "rabbitmq" da imagem (uid 100, gid 101): a readinessProbe exec
      # roda com o mesmo usuario do servidor e nao cria o .erlang.cookie como
      # root no PVC (o servidor falharia com "eacces" ao ler o cookie).
      securityContext:
        runAsUser: 100
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          env:
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/conf.d/90-oficina.conf
              subPath: 90-oficina.conf
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
