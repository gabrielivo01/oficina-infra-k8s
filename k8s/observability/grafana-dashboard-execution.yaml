apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-execution-dashboard
  namespace: oficina
  labels:
    grafana_dashboard: "1"
data:
  oficina-execution.json: |
    {
      "uid": "oficina-execution",
      "title": "Oficina - Execution Service",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Disponibilidade",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "up{service=\"oficina-execution-service\"}", "refId": "A" }]
        },
        {
          "id": 2,
          "title": "Requisições por segundo",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 9, "x": 6, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{service=\"oficina-execution-service\"}[5m])) by (uri)", "legendFormat": "{{uri}}", "refId": "A" }]
        },
        {
          "id": 3,
          "title": "Latência p95 por rota",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 9, "x": 15, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service=\"oficina-execution-service\"}[5m])) by (le, uri))", "legendFormat": "{{uri}}", "refId": "A" }]
        },
        {
          "id": 4,
          "title": "Uso de memória JVM",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [{ "expr": "sum(jvm_memory_used_bytes{service=\"oficina-execution-service\"}) by (area)", "legendFormat": "{{area}}", "refId": "A" }]
        },
        {
          "id": 5,
          "title": "Mensagens pendentes nas filas Execution",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
          "targets": [{ "expr": "sum(rabbitmq_queue_messages_ready{queue=~\"execution\\\\..*\"}) by (queue)", "legendFormat": "{{queue}}", "refId": "A" }]
        }
      ]
    }
