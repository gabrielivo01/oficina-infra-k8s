apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: oficina
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - plataforma
  selector:
    matchLabels:
      app: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
