# /metrics/per-object: metricas por fila (label queue), usadas pelos paineis de filas/DLQ e pelo alerta de DLQ.
# O /metrics padrao do rabbitmq_prometheus agrega tudo numa serie sem label de fila.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: oficina
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - plataforma
  selector:
    matchLabels:
      app: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics/per-object
      interval: 30s
